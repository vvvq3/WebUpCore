# Пример конфигурации nginx для up-core.ru (статический сайт из site/dist + обработчик формы на PHP-FPM).
# Положить в /etc/nginx/sites-available/up-core.ru, сделать ссылку в sites-enabled, затем: nginx -t && systemctl reload nginx
# Сертификат: certbot --nginx -d up-core.ru -d www.up-core.ru

server {
    listen 80;
    listen [::]:80;
    server_name up-core.ru www.up-core.ru;
    return 301 https://up-core.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.up-core.ru;
    ssl_certificate     /etc/letsencrypt/live/up-core.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/up-core.ru/privkey.pem;
    return 301 https://up-core.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name up-core.ru;

    ssl_certificate     /etc/letsencrypt/live/up-core.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/up-core.ru/privkey.pem;

    root /var/www/up-core.ru;     # сюда — содержимое site/dist/
    index index.html;
    charset utf-8;

    # сжатие (стили встроены в HTML — без сжатия страницы в ~5 раз тяжелее)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;
    # brotli on; brotli_types ...;   # если установлен модуль ngx_brotli

    # заголовки безопасности (nginx: add_header внутри location отменяет серверные — поэтому они повторены в location ниже)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # адрес без слеша → со слешем (/grade → /grade/), если есть такая папка
    location ~ ^([^.?]*[^/])$ {
        if (-d $document_root$1) { return 301 $1/$is_args$args; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # файлы с хэшем в имени — кэш на год
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }
    location ~* ^/(img|og)/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # обработчик формы заявки (site/deploy/form-handler.php → /api/lead.php)
    location = /api/lead.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/lead.php;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # путь к сокету PHP-FPM вашей версии
        # Telegram (или задать в pool php-fpm: env[TG_BOT_TOKEN] = ...)
        # fastcgi_param TG_BOT_TOKEN "123456:ABC...";
        # fastcgi_param TG_CHAT_ID   "123456789";
        client_max_body_size 64k;
    }
    location ~ \.php$ { return 404; }   # другие PHP-файлы не исполнять

    error_page 404 /404.html;
    location = /404.html { internal; }
}
